name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Explicit build type: on single-config generators an install with
      # --config Debug only emits the per-config export file if the build was
      # configured for Debug (otherwise find_package sees no IMPORTED_LOCATION).
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      # The installed package must be usable from an external project with
      # nothing but CMAKE_PREFIX_PATH (#28). Same config as the build, so the
      # MSVC runtimes match.
      - name: Install
        run: cmake --install build --config Debug --prefix ${{ github.workspace }}/prefix

      - name: Configure consumer
        run: cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=${{ github.workspace }}/prefix

      - name: Build consumer
        run: cmake --build build-consumer --config Debug

      - name: Run consumer (Linux)
        if: runner.os == 'Linux'
        run: ./build-consumer/orb_consumer

      - name: Run consumer (Windows)
        if: runner.os == 'Windows'
        run: ./build-consumer/Debug/orb_consumer.exe

  # AddressSanitizer + UndefinedBehaviorSanitizer run of the whole test suite.
  # Catches out-of-bounds reads like #15 automatically instead of in review.
  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DORB_SANITIZE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # wasm32 build with Emscripten; the whole test suite runs under node
  # through ctest (the toolchain registers node as the emulator) (#27).
  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.19
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-wasm

      - name: Test
        run: ctest --test-dir build-wasm --output-on-failure

      - name: Run orb_test on the sample image
        run: node build-wasm/orb_test.js pinball.jpg
